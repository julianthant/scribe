name: Reconcile

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Hourly on UTC weekdays covers Pacific business hours.
    - cron: "0 * * * 1-5"

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Poll the mailbox once
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKEN_CACHE_B64: ${{ secrets.TOKEN_CACHE_B64 }}
          MAILBOX_ADDRESS: smc.scribe@outlook.com
          TOKEN_CACHE_PATH: /tmp/token_cache.json
          STATE_DB_PATH: /tmp/scribe.db
          LOCAL_WHISPER_ENABLED: "false"
          ONEDRIVE_XLSX_PATH: Scribe/voicemails.xlsx
        run: |
          umask 077
          trap 'rm -f /tmp/token_cache.json' EXIT
          printf '%s' "$TOKEN_CACHE_B64" | base64 -d > /tmp/token_cache.json
          chmod 600 /tmp/token_cache.json
          before=$(sha256sum /tmp/token_cache.json | awk '{print $1}')
          uv sync --locked --extra dev
          uv run python -m app.poll
          after=$(sha256sum /tmp/token_cache.json | awk '{print $1}')
          if [ "$before" != "$after" ]; then
            echo "::warning title=Token cache rotated::Update TOKEN_CACHE_B64 from the new cache. Actions cannot write secrets. If the VM is also running, keep one cache as the source of truth."
          fi
