name: Reconcile

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Hourly on UTC weekdays covers Pacific business hours.
    - cron: "0 * * * 1-5"

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Poll the mailbox once
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILBOX_ADDRESS: ${{ secrets.MAILBOX_ADDRESS }}
          GOOGLE_TOKEN_PATH: /tmp/google_token.json
          STATE_DB_PATH: /tmp/scribe.db
          LOCAL_WHISPER_ENABLED: "false"
        run: |
          umask 077
          trap 'rm -f /tmp/google_token.json' EXIT
          printf '%s' "$GOOGLE_TOKEN_B64" | base64 -d > /tmp/google_token.json
          chmod 600 /tmp/google_token.json
          before=$(sha256sum /tmp/google_token.json | awk '{print $1}')
          uv sync --locked --extra dev
          uv run python -m app.poll
          after=$(sha256sum /tmp/google_token.json | awk '{print $1}')
          if [ "$before" != "$after" ]; then
            echo "::warning title=Token file changed::Update GOOGLE_TOKEN_B64 from the new file. Actions cannot write secrets. If the VM is also running, keep one token file as the source of truth."
          fi
